name: Deploy to Vultr

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USERNAME }}
          password: ${{ secrets.VULTR_PASSWORD }}
          script: |
            cd LINE-app
            # Backup Vultr's live database files before touching git
            cp message.json /tmp/message.json.bak || true
            cp subs.json /tmp/subs.json.bak || true
            cp bp-logs.json /tmp/bp-logs.json.bak || true
            cp oneoff-reminders.json /tmp/oneoff-reminders.json.bak || true
            
            # Force pull the latest code from GitHub
            git fetch --all
            git reset --hard origin/main
            
            # Restore Vultr's live database files over whatever GitHub just pulled
            cp /tmp/message.json.bak message.json || true
            cp /tmp/subs.json.bak subs.json || true
            cp /tmp/bp-logs.json.bak bp-logs.json || true
            cp /tmp/oneoff-reminders.json.bak oneoff-reminders.json || true
            
            sudo docker rm -f my-line-bot || true
            sudo docker build -t line-bot .
            touch message.json subs.json bp-logs.json oneoff-reminders.json
            sudo docker run -d --name my-line-bot --restart unless-stopped \
              -v $(pwd)/message.json:/app/message.json \
              -v $(pwd)/subs.json:/app/subs.json \
              -v $(pwd)/bp-logs.json:/app/bp-logs.json \
              -v $(pwd)/oneoff-reminders.json:/app/oneoff-reminders.json \
              -e CHANNEL_ACCESS_TOKEN="${{ secrets.CHANNEL_ACCESS_TOKEN }}" \
              -e CHANNEL_SECRET="${{ secrets.CHANNEL_SECRET }}" \
              -e GROUP_ID="${{ secrets.GROUP_ID }}" \
              -e CALENDAR_URL="${{ secrets.CALENDAR_URL }}" \
              -e ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
              -e DASHBOARD_URL="${{ secrets.DASHBOARD_URL }}" \
              -p 4000:3000 line-bot