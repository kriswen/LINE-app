name: Deploy to Vultr

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Secure migration operation
        required: true
        type: choice
        options:
          - export
          - stop-old-bot

permissions:
  contents: read

jobs:
  export:
    if: inputs.operation == 'export'
    runs-on: ubuntu-latest
    steps:
      - name: Prepare encrypted export on Vultr
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USERNAME }}
          password: ${{ secrets.VULTR_PASSWORD }}
          script: |
            set -eu
            WORK="$HOME/line-cloudflare-export"
            rm -rf "$WORK"
            mkdir -p "$WORK/data"
            cd LINE-app
            for file in message.json subs.json bp-logs.json oneoff-reminders.json; do
              if [ -f "$file" ]; then cp "$file" "$WORK/data/$file"; fi
            done
            sudo docker exec my-line-bot env > "$WORK/data/container.env"
            tar -C "$WORK/data" -czf "$WORK/bundle.tar.gz" .
            printf '%s' '' | base64 -d > "$WORK/public.pem"
            openssl rand -hex 32 > "$WORK/passphrase"
            openssl enc -aes-256-cbc -pbkdf2 -salt -in "$WORK/bundle.tar.gz" -out "$WORK/bundle.enc" -pass file:"$WORK/passphrase"
            openssl pkeyutl -encrypt -pubin -inkey "$WORK/public.pem" -in "$WORK/passphrase" -out "$WORK/passphrase.enc" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
            chmod 600 "$WORK/bundle.enc" "$WORK/passphrase.enc"
      - name: Download encrypted export
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USERNAME }}
          password: ${{ secrets.VULTR_PASSWORD }}
          source: line-cloudflare-export/bundle.enc,line-cloudflare-export/passphrase.enc
          target: /tmp/line-export
          strip_components: 1
      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-cloudflare-encrypted-export
          path: /tmp/line-export
          retention-days: 1
      - name: Remove remote export
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USERNAME }}
          password: ${{ secrets.VULTR_PASSWORD }}
          script: rm -rf "$HOME/line-cloudflare-export"

  stop-old-bot:
    if: inputs.operation == 'stop-old-bot'
    runs-on: ubuntu-latest
    steps:
      - name: Disable and stop old LINE bot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USERNAME }}
          password: ${{ secrets.VULTR_PASSWORD }}
          script: |
            set -eu
            sudo docker update --restart=no my-line-bot
            sudo docker stop my-line-bot
            test "$(sudo docker inspect -f '{{.State.Running}}' my-line-bot)" = "false"
