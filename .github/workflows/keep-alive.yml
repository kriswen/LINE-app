name: Keep Render Server Awake

on:
  schedule:
    # Ping every 14 minutes to prevent Render's 15-minute idle sleep.
    # This guarantees the internal node-cron scheduler fires precisely!
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the Keep Alive Endpoint
        run: curl -s https://line-app-zqwh.onrender.com/keep-alive > /dev/null
